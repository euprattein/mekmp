plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.74'
}

version = '1.0.0'
group = 'com.mekmp'

base {
    archivesName = 'MekanismMorePump-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.194'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mekmp'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        mekmp {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }
}

dependencies {
    implementation "mekanism:Mekanism:1.21.1-10.7.18.84"
}
